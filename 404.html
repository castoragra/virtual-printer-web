<style>

         text-decoration: none; border: 1px solid transparent; font-size: 16px; cursor: pointer; font-family: inherit; }
  .btn.primary { background: var(--brand); color: #fff; }
  .btn.primary:hover { background: var(--brand-dark); }
  .btn.secondary { border-color: var(--line); color: var(--text); background: var(--card); }
  .btn.coffee { background: var(--coffee); color: #fff; }

  .note { color: var(--muted); font-size: 14px; margin-top: 14px; }
  .shot { margin: 40px auto 0; max-width: 1040px; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); box-shadow: var(--shadow); }
  .shot img { display: block; width: 100%; height: auto; }
  section { padding: 64px 0; }
  section.soft { background: var(--bg-soft); }
  h2 { font-size: clamp(26px, 3.4vw, 34px); margin: 0 0 12px; letter-spacing: -.01em; }
  h3 { font-size: 19px; margin: 26px 0 8px; }
  .sub { color: var(--muted); margin: 0 0 32px; max-width: 760px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px; }

  ol.steps { counter-reset: step; list-style: none; padding: 0; margin: 0; display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
  ol.steps li { counter-increment: step; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px 20px 20px 64px; position: relative; }
  ol.steps li::before { content: counter(step); position: absolute; left: 20px; top: 18px; width: 30px; height: 30px; border-radius: 50%;
                        background: var(--brand); color: #fff; display: grid; place-items: center; font-weight: 700; }
  .two { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px; align-items: start; }
  .center { text-align: center; }
  .center .card { max-width: 720px; margin: 0 auto; padding: 32px; }
  details { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 18px; margin-bottom: 10px; }
  summary { cursor: pointer; font-weight: 600; }

  .prose { max-width: 780px; }

  .prose { overflow-wrap: break-word; }
  .prose table { border-collapse: collapse; width: 100%; margin: 12px 0; font-size: 15.5px; display: block; overflow-x: auto; }
  .prose th, .prose td { border: 1px solid var(--line); padding: 8px 10px; text-align: left; vertical-align: top; }
  form.contact { display: grid; gap: 14px; text-align: left; }
  form.contact label { display: grid; gap: 6px; font-weight: 600; font-size: 15px; }
  form.contact input, form.contact select, form.contact textarea {

<script>
  // Recordar el idioma elegido; en la portada inglesa, proponer el español a quien lo usa
  (function () {
    function get() { try { return localStorage.getItem("vp-lang"); } catch (e) { return null; } }
    function set(v) { try { localStorage.setItem("vp-lang", v); } catch (e) { /* sin almacenamiento */ } }
    document.querySelectorAll("[data-lang-switch]").forEach(a => a.addEventListener("click", () => set(a.dataset.langSwitch)));
    if ("en" === "en" && "404" === "index" && !get() && (navigator.language || "").toLowerCase().startsWith("es")
        && !document.referrer.startsWith(location.origin)) {
      location.replace("https://virtualprinter.es/es/");
    }
  })();

  // Analítica (GoatCounter: sin cookies ni datos personales). Solo si hay código configurado.
  const GOATCOUNTER = "virtualprinter";
  function track(name) {
    if (window.goatcounter && window.goatcounter.count) {
      window.goatcounter.count({ path: name, title: name, event: true });
    }
  }
  if (GOATCOUNTER) {
    const s = document.createElement("script");
    s.async = true; s.src = "https://gc.zgo.at/count.js";
    s.dataset.goatcounter = `https://${GOATCOUNTER}.goatcounter.com/count`;
    document.head.appendChild(s);
  }
  document.querySelectorAll("[data-track]").forEach(el => el.addEventListener("click", () => track(el.dataset.track)));
</script>
